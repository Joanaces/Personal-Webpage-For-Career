<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zhiwei Zhou</title>
  <meta name="description" content="Zhiwei Zhou — interactive pixel-art resume">
  <link rel="preload" href="assets/fonts/font.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- INITIAL_LOADING cover (no text: the font may not be ready yet) -->
  <div id="loader" aria-hidden="true"><div class="loader-bar"><i></i></div></div>

  <main id="stage" data-state="INITIAL_LOADING">

    <!-- Layer 1: background (camera moves these; the taskbar never moves) -->
    <div id="world" aria-hidden="true">
      <img class="layer" id="L-base"    src="assets/img/sky-base.png"    alt="" draggable="false">
      <img class="layer" id="L-far"     src="assets/img/clouds-far.png"  alt="" draggable="false">
      <img class="layer" id="L-near"    src="assets/img/clouds-near.png" alt="" draggable="false">
      <img class="layer" id="L-hill"    src="assets/img/hill.png"        alt="" draggable="false">
      <img id="L-taskbar" src="assets/img/taskbar.png" alt="" draggable="false">
    </div>

    <!-- Layer 2: character and objects (viewport-anchored, unaffected by the camera) -->
    <div id="actors">
      <div id="hero" role="img" aria-label="Zhiwei Zhou, pixel character" hidden></div>
      <button id="folder" type="button" disabled hidden data-i18n-aria="folder.aria">
        <span class="folder-img"></span>
      </button>
    </div>

    <!-- Layer 3: UI -->
    <div id="ui">
      <div id="bubble" hidden aria-live="polite">
        <div class="bubble-bg"></div>
        <p class="bubble-text"></p>
      </div>

      <!-- Language menu: background, cursor and text are separate elements -->
      <div id="lang-menu" hidden role="listbox" tabindex="-1" aria-label="Language / 语言">
        <div class="menu-frame"></div>
        <div class="menu-fill"></div>
        <span class="menu-cursor" aria-hidden="true"></span>
        <ul class="menu-list">
          <li role="option" id="opt-en" data-lang="en" class="menu-row"><span class="menu-label" data-i18n="menu.en">I'd like to hear English</span></li>
          <li role="option" id="opt-zh" data-lang="zh" class="menu-row"><span class="menu-label" data-i18n="menu.zh">我想用中文交流</span></li>
        </ul>
      </div>

      <button id="speaker" type="button" disabled hidden class="off" data-i18n-aria="speaker.off">
        <span class="sp-fly"><span class="sp-img"></span></span>
      </button>
    </div>
  </main>

  <noscript><p style="position:fixed;inset:0;margin:0;padding:24px;background:#10163a;color:#f2e8c9;font:16px sans-serif">This interactive page needs JavaScript. / 此页面需要启用 JavaScript。</p></noscript>

  <!-- Classic scripts (no ES modules) so the page also works when opened from disk, and on GitHub Pages. -->
  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/props.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/story.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
